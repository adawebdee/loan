<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>SR Finance — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#060f17;--surface:#0d1a24;--surface2:#111e2a;--surface3:#162330;
      --blue:#3b82f6;--blue2:#2563eb;--blue-dim:rgba(59,130,246,.12);--blue-border:rgba(59,130,246,.25);
      --green:#22c55e;--green-dim:rgba(34,197,94,.12);--green-border:rgba(34,197,94,.2);
      --red:#ef4444;--red-dim:rgba(239,68,68,.1);--red-border:rgba(239,68,68,.2);
      --warn:#f59e0b;--warn-dim:rgba(245,158,11,.1);--warn-border:rgba(245,158,11,.2);
      --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
      --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.04);
      --shadow:0 8px 32px rgba(0,0,0,.5)
    }
    html,body{height:100%;background:var(--bg);background-image:radial-gradient(ellipse at top,rgba(59,130,246,.07) 0%,transparent 60%)}
    body{color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
    .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 20px 22px;box-shadow:var(--shadow)}
    .logo-wrap{text-align:center;margin-bottom:22px}
    .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;margin:0 auto 10px;box-shadow:0 6px 20px rgba(59,130,246,.35)}
    .logo-wrap h1{font-size:19px;font-weight:800;color:var(--text)}
    .logo-wrap .sub{font-size:11px;color:var(--text3);margin-top:2px}
    .role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:20px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--border)}
    .role-tab{padding:9px 6px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
    .role-tab:active{transform:scale(.97)}
    .role-tab.active.staff-tab{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 12px rgba(59,130,246,.3)}
    .role-tab.active.admin-tab{background:linear-gradient(135deg,var(--warn),#d97706);color:#fff;box-shadow:0 3px 12px rgba(245,158,11,.25)}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:10px;font-weight:700;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    .field select,.field input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;transition:border .15s;min-height:44px}
    .field select:focus,.field input:focus{outline:none;border-color:var(--blue);background:var(--surface3)}
    .field select option{background:var(--surface2);color:var(--text)}
    .field input::placeholder{color:var(--text3);font-size:12px}
    .pw-wrap{position:relative}.pw-wrap input{padding-right:44px}
    .pw-eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px;display:flex;align-items:center;justify-content:center}
    .btn-login{width:100%;padding:13px;border-radius:11px;border:none;color:#fff;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;white-space:nowrap}
    .btn-login.staff{background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 4px 14px rgba(59,130,246,.3)}
    .btn-login.admin{background:linear-gradient(135deg,var(--warn),#d97706);box-shadow:0 4px 14px rgba(245,158,11,.25)}
    .btn-login:active{transform:scale(.98)}
    .login-footer{text-align:center;margin-top:16px;font-size:10px;color:var(--text3)}
    .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
    .toast.show{opacity:1}
    @media(max-width:380px){.card{padding:20px 14px 18px;border-radius:16px}.logo{width:48px;height:48px;font-size:18px}.logo-wrap h1{font-size:17px}.field select,.field input{font-size:12px;min-height:42px}.btn-login{font-size:13px;min-height:44px}}
  </style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo">SF</div>
    <h1>SR Finance</h1>
    <div class="sub">Money Collection System</div>
  </div>
  <div class="role-tabs">
    <button class="role-tab staff-tab active" id="tabStaff" onclick="setRole('staff')">👤 Staff Login</button>
    <button class="role-tab admin-tab" id="tabAdmin" onclick="setRole('admin')">🛡 Admin Login</button>
  </div>

  <!-- STAFF -->
  <div id="staffFields">
    <div class="field">
      <label>Select Your Name</label>
      <select id="userDrop" onchange="document.getElementById('staffPwd').value=''">
        <option value="">-- Choose your name --</option>
      </select>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="staffPwd" placeholder="Enter your password" autocomplete="current-password"/>
        <button class="pw-eye" onclick="togglePw('staffPwd','eyeS')" id="eyeS">👁</button>
      </div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="adminFields" style="display:none">
    <div class="field">
      <label>Admin Username</label>
      <input type="text" id="adminUser" placeholder="Enter username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="adminPwd" placeholder="Enter password" autocomplete="current-password"/>
        <button class="pw-eye" onclick="togglePw('adminPwd','eyeA')" id="eyeA">👁</button>
      </div>
    </div>
  </div>

  <button class="btn-login staff" id="loginBtn" onclick="doLogin()">
    <span id="loginIcon">🔐</span><span id="loginTxt">Login</span>
  </button>
  <div class="login-footer">SR Finance © 2025 · Secure Login</div>
</div>
<div class="toast" id="toast"></div>
<script>
  const ADMIN={username:'admin',password:'admin@2025',name:'Admin',id:'admin',role:'admin'};
  let currentRole='staff',allUsers=[];
  const DEFAULT_USERS=[
    {id:'user01',name:'Ravi Kumar', password:'ravi123',  phone:'9876543210',address:'Chennai, TN',   role:'user'},
    {id:'user02',name:'Suresh M',   password:'suresh123',phone:'9123456780',address:'Madurai, TN',   role:'user'},
    {id:'user03',name:'Priya S',    password:'priya123', phone:'9988776655',address:'Coimbatore, TN',role:'user'}
  ];
  try{const _ex=localStorage.getItem('srUser');if(_ex){const _eu=JSON.parse(_ex);window.location.href=_eu.role==='admin'?'admin-users.html':'collection.html'}}catch(e){localStorage.removeItem('srUser')}
  function loadUsers(){const saved=localStorage.getItem('srUsers');if(saved){try{allUsers=JSON.parse(saved)}catch(e){allUsers=[...DEFAULT_USERS]}}else{allUsers=[...DEFAULT_USERS];localStorage.setItem('srUsers',JSON.stringify(allUsers))}buildDrop()}
  function buildDrop(){const sel=document.getElementById('userDrop');sel.innerHTML='<option value="">-- Choose your name --</option>';allUsers.filter(u=>u.role!=='admin').forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.name;sel.appendChild(o)})}
  function setRole(role){
    currentRole=role;const isAdmin=role==='admin';
    document.getElementById('tabStaff').classList.toggle('active',!isAdmin);
    document.getElementById('tabAdmin').classList.toggle('active',isAdmin);
    document.getElementById('staffFields').style.display=isAdmin?'none':'block';
    document.getElementById('adminFields').style.display=isAdmin?'block':'none';
    const btn=document.getElementById('loginBtn');
    btn.className=isAdmin?'btn-login admin':'btn-login staff';
    document.getElementById('loginIcon').textContent=isAdmin?'🛡':'🔐';
    document.getElementById('loginTxt').textContent=isAdmin?'Admin Login':'Login';
    document.getElementById('staffPwd').value='';document.getElementById('adminPwd').value='';document.getElementById('adminUser').value='';document.getElementById('userDrop').value='';
  }
  function togglePw(inputId,btnId){const inp=document.getElementById(inputId);const btn=document.getElementById(btnId);inp.type=inp.type==='password'?'text':'password';btn.textContent=inp.type==='password'?'👁':'🙈'}
  function doLogin(){
    if(currentRole==='admin'){
      const uname=(document.getElementById('adminUser').value||'').trim();const pwd=document.getElementById('adminPwd').value||'';
      if(!uname){sT('⚠️ Enter username');return}if(!pwd){sT('⚠️ Enter password');return}
      if(uname!==ADMIN.username||pwd!==ADMIN.password){sT('❌ Wrong admin credentials');return}
      localStorage.setItem('srUser',JSON.stringify({id:ADMIN.id,name:ADMIN.name,role:'admin',username:ADMIN.username}));
      sT('✅ Admin login!');setTimeout(()=>{window.location.href='admin-users.html'},500);return;
    }
    const uid=document.getElementById('userDrop').value;const pwd=document.getElementById('staffPwd').value;
    if(!uid){sT('⚠️ Select your name');return}if(!pwd){sT('⚠️ Enter password');return}
    const user=allUsers.find(u=>u.id===uid);if(!user){sT('⚠️ User not found');return}
    if(user.password!==pwd){sT('❌ Wrong password');return}
    localStorage.setItem('srUser',JSON.stringify({id:user.id,name:user.name,role:'user',phone:user.phone||'',address:user.address||''}));
    sT('✅ Login successful!');setTimeout(()=>{window.location.href='collection.html'},500);
  }
  document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
  function sT(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
  loadUsers();
</script>
</body>
</html>
